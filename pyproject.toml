[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-agentic-framework"
version = "0.1.0"
description = "Reusable Python infrastructure for building agentic systems."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3.0",
    "ollama>=0.4.0,<1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kern*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]